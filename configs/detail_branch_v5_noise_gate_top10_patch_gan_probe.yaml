project:
  name: detail_branch_v5_noise_gate_top10_patch_gan_probe
  output_dir: /home/ubuntu/scratch/sr-diffusion/runs/detail_branch_v5_noise_gate_top10_patch_gan_probe

logging:
  wandb:
    enabled: true
    project: LuSIR
    entity: jwheo
    name: detail_branch_v5_noise_gate_top10_patch_gan_probe
    mode: online
    dir: /home/ubuntu/scratch/sr-diffusion/wandb
    group: stage-detail
    job_type: detail-branch
    tags: [detail-branch, detail-mask, noise-negative-mask, top10, patch-perceptual, patchgan, v5, probe, photo130k-lsdir]
    watch: false

seed: 1337

initialization:
  checkpoint: checkpoints/detail_branch_v2_masked_photo130k_lsdir_best38000.pt
  model_only: true
  identity_init_new_blocks: false
  note: restart from selected deterministic v2 and restrict texture generation to v2 noise-negative top10 mask

autoencoder:
  config: configs/autoencoder_photo10k.yaml
  checkpoint: checkpoints/stage1_autoencoder_best_eval_recon.pt

condition_encoder:
  config: configs/latent_pretrain_photo130k_lsdir_dual_multiscale_long.yaml
  checkpoint: checkpoints/stage2_photo130k_lsdir_dual_multiscale_best98000.pt
  trainable: false

detail_mask:
  config: configs/hf/detail_mask_predictor_v2_noise_negative.yaml
  checkpoint: checkpoints/detail_mask_predictor_v2_noise_negative_best1500.pt
  trainable: false
  floor: 0.0
  top_fraction: 0.10
  top_mode: binary

data:
  manifest: /home/ubuntu/scratch/sr-diffusion/data/manifest_photo130k_lsdir.csv
  split: train
  hr_size: 512
  scale: 4
  degradation_preset: photo_detail_mix
  domains:
    photo: 0
    anime: 1
  hflip_prob: 0.5
  texture_crop_retries: 4
  texture_crop_downsample: 128
  hr_color_jitter_prob: 0.25
  hr_color_jitter: [0.97, 1.03]
  num_workers: 4

model:
  image_channels: 3
  latent_channels: 16
  hidden_channels: 96
  num_blocks: 18
  norm_groups: 32
  num_domains: 2
  residual_scale: 0.24
  gate_bias: -1.5
  highpass_kernel: 15
  use_condition_latent: true

loss:
  image_weight: 0.85
  residual_target_weight: 0.70
  highpass_weight: 1.30
  laplacian_weight: 0.90
  lowpass_anchor_weight: 1.10
  gate_l1_weight: 0.0003
  residual_l1_weight: 0.0003
  masked_perceptual_weight: 0.12
  masked_perceptual:
    resize: 256
    layer_indices: [3, 8, 15, 22]
    layer_weights: [1.0, 1.0, 1.0, 0.5]
  highpass_kernel: 15
  lowpass_kernel: 31
  charbonnier_eps: 0.001

adversarial:
  enabled: true
  start_step: 500
  generator_weight: 0.01
  discriminator_lr: 0.00003
  weight_decay: 0.0
  betas: [0.0, 0.99]
  image_channels: 3
  base_channels: 32
  channel_multipliers: [1, 2, 4, 4]
  highpass_kernel: 15
  mask_floor: 0.0
  use_spectral_norm: true

train:
  device: auto
  dtype: bf16
  batch_size: 2
  max_steps: 5000
  lr: 0.00001
  weight_decay: 0.0
  grad_accum_steps: 4
  log_every: 25
  save_every: 500

eval:
  enabled: true
  split: val
  limit: 100
  batch_size: 4
  num_workers: 4
  every: 250
  run_at_start: true
  best_metric: eval/detail_score
  best_mode: max
  sample_count: 8
