project:
  name: latent_pretrain_photo130k_lsdir_dual_detail_guarded_v2_hf

autoencoder:
  config: configs/autoencoder_photo10k.yaml
  checkpoint: checkpoints/stage1_autoencoder_best_eval_recon.pt

data:
  hr_size: 512
  scale: 4
  degradation_preset: photo_detail_mix
  domains:
    photo: 0
    anime: 1

model:
  type: lr_to_latent_predictor
  architecture: dual_multiscale_context
  in_channels: 3
  latent_channels: 16
  base_channels: 256
  num_blocks: 16
  norm_groups: 32
  num_domains: 2
  context_channels: [320, 448]
  context_blocks: [4, 6]
  context_scale: 1.0
  extra_context_channels: [384, 512]
  extra_context_blocks: [6, 8]
  extra_context_scale: 1.0

train:
  dtype: bf16

inference:
  checkpoint: checkpoints/stage2_photo130k_lsdir_dual_detail_guarded_v2_best10000.pt
