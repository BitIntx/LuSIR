project:
  name: residual_refiner_stage2_xl_photo_detail_v2_hf

autoencoder:
  config: autoencoder_stage1.yaml
  checkpoint: ../../checkpoints/stage1_autoencoder_best_eval_recon.pt

condition_encoder:
  config: latent_pretrain_photo100k_v3_noise_xl.yaml
  checkpoint: ../../checkpoints/stage2_photo100k_v3_noise_xl_b64_step_0072000.pt
  trainable: false

data:
  hr_size: 512
  scale: 4
  degradation_preset: photo_detail_mix
  domains:
    photo: 0
    anime: 1

model:
  latent_channels: 16
  lr_channels: 3
  hidden_channels: 192
  num_blocks: 12
  norm_groups: 32
  num_domains: 2
  residual_scale: 1.25
  gate_bias: 0.0

train:
  dtype: bf16

inference:
  checkpoint: ../../checkpoints/residual_refiner_stage2_xl_photo_detail_v2_best11000.pt
