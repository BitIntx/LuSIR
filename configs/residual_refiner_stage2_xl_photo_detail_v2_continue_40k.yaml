train:
  device: auto
  dtype: bf16
  batch_size: 12
  max_steps: 40000
  lr: 0.00005
  resume_lr: 0.000025
  weight_decay: 0.0
  grad_accum_steps: 2
  log_every: 25
  save_every: 4000

eval:
  enabled: true
  split: val
  limit: 100
  batch_size: 8
  num_workers: 4
  every: 500
  run_at_start: false
  best_metric: eval/refined_decoded_psnr
  best_mode: max
  sample_count: 8
