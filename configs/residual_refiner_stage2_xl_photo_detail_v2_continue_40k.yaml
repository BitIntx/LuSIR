data:
  manifest: /home/jwheojjang/scratch/sr-diffusion/data/manifest_photo100k.csv
  split: train
  hr_size: 512
  scale: 4
  degradation_preset: photo_detail_mix
  domains:
    photo: 0
    anime: 1
  num_workers: 4

model:
  latent_channels: 16
  lr_channels: 3
  hidden_channels: 192
  num_blocks: 12
  norm_groups: 32
  num_domains: 2
  residual_scale: 1.25
  gate_bias: 0.0

loss:
  latent_weight: 1.0
  residual_weight: 0.5
  highpass_weight: 1.5
  decoded_weight: 0.1
  decoded_highpass_weight: 0.5
  gate_l1_weight: 0.0005
  highpass_kernel: 15
  decoded_highpass_kernel: 15
