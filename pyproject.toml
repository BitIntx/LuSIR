[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-diffusion"
version = "0.1.0"
description = "LuSIR: Latent Upscaling via Self-trained Image Restoration."
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pyarrow",
  "pillow",
  "pyyaml",
  "torch",
  "torchvision",
  "wandb",
  "huggingface_hub",
]

[project.optional-dependencies]
perceptual = [
  "lpips",
  "DISTS-pytorch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
